<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Missing Fields Form</title>
</head>
<body>
    <form id="missing-fields-form">
        <div class="row">
            <label for="user_email">Email Address</label>
            <input id="user_email" type="email" placeholder="Email" />
        </div>
        <div class="row">
            <label for="user_comments">Comments</label>
            <textarea id="user_comments"></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
