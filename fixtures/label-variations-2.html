<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Label Variations Form - Variation 2</title>
</head>
<body>
    <h2>Form Variation 2: Your First Name, Your Gender, Choose State</h2>
    <form id="form-variation-2">
        <div class="row">
            <label for="fld_your_fn">Your First Name</label>
            <input id="fld_your_fn" type="text" name="txt_your_first_name" placeholder="Your First Name" />
        </div>
        <div class="row">
            <span class="custom-header">Your Gender</span>
            <div>
                <label><input type="radio" name="rad_gender_pref" value="Male" /> Male</label>
                <label><input type="radio" name="rad_gender_pref" value="Female" /> Female</label>
            </div>
        </div>
        <div class="row">
            <label for="fld_choose_state">Choose State</label>
            <select id="fld_choose_state" name="opt_chosen_state">
                <option value="">-- Choose --</option>
                <option value="India">India</option>
                <option value="Texas">Texas</option>
            </select>
        </div>
    </form>
</body>
</html>
