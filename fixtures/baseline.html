<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Baseline Automation Practice Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .form-group { margin-bottom: 15px; }
        .control-label { display: block; font-weight: bold; margin-bottom: 5px; }
        .form-control { width: 300px; padding: 8px; box-sizing: border-box; }
        .radio-inline { margin-right: 15px; }
    </style>
</head>
<body>
    <h2>Form</h2>
    <form id="automationtestform" method="post">
        <div class="form-group">
            <label for="fname" class="control-label">First Name</label>
            <input id="fname" type="text" name="First Name" class="form-control" placeholder="Name" />
        </div>

        <div class="form-group">
            <label for="lname" class="control-label">Last Name</label>
            <input id="lname" type="text" name="Last Name" class="form-control" placeholder="Surname" />
        </div>

        <div class="form-group">
            <label class="control-label">Gender</label>
            <div>
                <input id="male" type="radio" name="gender" value="Male" />
                <span class="control-label">Male</span>
                <input id="female" type="radio" name="gender" value="Female" />
                <span class="control-label">Female</span>
                <input id="transgender" type="radio" name="gender" value="Transgender" />
                <span class="control-label">Transgender</span>
            </div>
        </div>

        <div class="form-group">
            <label for="country" class="control-label">Country</label>
            <input id="country" type="text" name="Country" placeholder="Country" class="form-control" />
        </div>

        <div class="form-group">
            <label for="state" class="control-label">State</label>
            <select id="state" name="State" class="form-control">
                <option> -- Select Country -- </option>
                <option value="Afganistan"> Afganistan </option>
                <option value="Australia">Australia</option>
                <option value="Canada">Canada</option>
                <option value="Germany">Germany</option>
                <option value="India">India</option>
                <option value="United Kingdom">United Kingdom</option>
                <option value="United States">United States</option>
                <option value="Zimbabwe">Zimbabwe</option>
            </select>
        </div>

        <button type="submit">Submit</button>
    </form>
</body>
</html>
